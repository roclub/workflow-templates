name: "PR Title Checker"
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - 'main'

permissions:
  pull-requests: write

jobs:
  pr_title_checker:
    runs-on: ubuntu-slim
    steps:
      - name: Check PR title
        id: lint_pr_title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            perf
            test
            chore
            refactor

      - name: Comment on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prTitle = context.payload.pull_request.title;
            const errorMessage = ${{ toJSON(steps.lint_pr_title.outputs.error_message) }} ?? 'PR title validation failed.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `The title of your PR '${prTitle}' is non-compliant to the conventions.\n\n${errorMessage}\n\nPlease refer to our [GitHub documentation in Notion](https://www.notion.so/roclub/Git-GitHub-GitFlow-85cbb825be004d4d8b8ff6c0fa12204b?pvs=4#47e4e0bd334a4b0da3f6f3ad33e4009a).`,
            });
